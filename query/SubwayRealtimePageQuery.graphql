query SubwayRealtimePageQuery($keys: [SubwayStationInput!]!, $language: String!) {
    subway (
        input: {
            language: $language,
            keys: $keys,
        }) {
        stationID
        realtime {
            updatedAt
        }
        arrival {
            direction
            entries {
                minutes
                origin { stationID, name }
                terminal { stationID, name }
                isRealtime
                location
                stops
                trainNumber
                isExpress
                isLast
                status
            }
        }
    }
}
