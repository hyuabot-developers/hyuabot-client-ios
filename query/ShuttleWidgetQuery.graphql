query ShuttleWidgetQuery($after: LocalTime) {
    shuttle(input: {
        stops: [
            { name: "dormitory_o", limit: { order: 12, destination: 16 } },
            { name: "shuttlecock_o", limit: { order: 12, destination: 16 } },
            { name: "station", limit: { order: 12, destination: 16 } },
            { name: "terminal", limit: { order: 12, destination: 16 } },
            { name: "jungang_stn", limit: { order: 12, destination: 16 } },
            { name: "shuttlecock_i", limit: { order: 12, destination: 16 } }
        ],
        after: $after
    }) {
        stops {
            latitude
            longitude
            name
            timetable {
                destination {
                    destination
                    entries {
                        route { tag name }
                        time
                    }
                }
            }
        }
    }
}
